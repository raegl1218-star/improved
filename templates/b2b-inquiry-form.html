<section class="b2b-inquiry">
  <form id="b2bInquiryForm" novalidate>
    <input class="honeypot" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />

    <label>
      Name <span>*</span>
      <input name="name" required placeholder="Your full name" autocomplete="name" />
      <small>Please enter your name.</small>
    </label>

    <label>
      Email <span>*</span>
      <input name="email" required type="email" placeholder="name@company.com" autocomplete="email" />
      <small>Please enter a valid business email.</small>
    </label>

    <label>
      Phone <span>*</span>
      <input name="phone" required inputmode="tel" placeholder="+1 555 123 4567" autocomplete="tel" />
      <small>Use international format when possible.</small>
    </label>

    <label>
      Company Name
      <input name="company" placeholder="Your company name" autocomplete="organization" />
    </label>

    <label>
      Country / Region
      <input name="country" placeholder="Canada, Germany, UAE..." autocomplete="country-name" />
    </label>

    <label>
      Product Requirement
      <select name="requirement">
        <option value="">Select a product category</option>
        <option>IQF Frozen Vegetables</option>
        <option>Frozen Edamame / Mukimame</option>
        <option>Noodle & Pastry</option>
        <option>Seafood</option>
        <option>OEM / Private Label Program</option>
      </select>
    </label>

    <label class="full">
      Message
      <textarea name="message" placeholder="Product, packaging, quantity, destination port, certifications..."></textarea>
    </label>

    <button type="submit">Submit Inquiry</button>
    <p id="formStatus" role="status" aria-live="polite"></p>
  </form>
</section>

<script>
  const FORM_ENDPOINT = ""; // Add your backend, Formspree, CRM, or serverless API URL here.
  const required = ["name", "email", "phone"];
  const validators = {
    name: (value) => value.trim().length >= 2,
    email: (value) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value.trim()),
    phone: (value) => /^\+?[0-9\s().-]{7,22}$/.test(value.trim()),
  };

  document.getElementById("b2bInquiryForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const status = document.getElementById("formStatus");
    const valid = required.every((name) => validators[name](form.elements[name].value));

    if (form.elements.website.value) return;
    if (!valid) {
      status.textContent = "Please complete all required fields before submitting.";
      status.className = "error";
      return;
    }

    try {
      const payload = Object.fromEntries(new FormData(form).entries());
      if (!FORM_ENDPOINT) throw new Error("Missing FORM_ENDPOINT");
      const response = await fetch(FORM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!response.ok) throw new Error("Submit failed");
      status.textContent = "Thank you. Your inquiry has been submitted successfully.";
      status.className = "success";
      form.reset();
    } catch (error) {
      status.textContent = "Submission failed. Please connect FORM_ENDPOINT or contact sales by email.";
      status.className = "error";
    }
  });
</script>
